    <title>Paisatge de Barcelona</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;   /* El body no té desplaçament, el visor sí */
            background-color: #333333;  /* Fons fosc per veure millor els límits */
        }
        text {
            fill: white;
            font-size: 64px;
        }
        #visor {
            width: 100vw;
            height: 100vh;
            overflow: auto; /* Barres de desplaçament automàtiques */
            cursor: grab;
            position: relative;
            -webkit-overflow-scrolling: touch;  /* Millora per al scroll tàctil */
        }
        #visor.arrastrando {
            cursor: grabbing;
        }
        #elSVG {    /* Suprimim height:100% perquè JS controli la mida real */
            display: block;
            transform-origin: 0 0;  /* Transform-origin ajuda a fer que el redibuix sigui suau */
        }
        #elSVG path {   /* estils de paths */
            cursor: pointer;
            fill: #7f7f7f00; 
            stroke: none;
            transition: fill .2s;
        }
        #elSVG path:hover {
            fill: #ffffff05;
            stroke: #ffffff10;
            stroke-width: .5px;
        }
        #tooltip {
            position: fixed;
            display: none;
            background-color: #00007f7f;
            color: yellow;
            padding: 2px 6px;
            border: 1px solid #ff00007f;
            border-radius: 4px;
            font-family: Arial, monospace; /* Tipus de lletra Arial i monoespai a l'estil de la consola */
            font-size: 16px;
            pointer-events: none; 
            z-index: 9999;
            white-space: nowrap;
        }
        .linea {
            stroke: #7f7f7f;
            stroke-width: 100px;
            stroke-linecap: round;
        }
        .boton {
            stroke: #7f7f7f00;
            stroke-width: 100px;
            stroke-linecap: round;
            cursor: pointer;
            pointer-events: all;
        }
        .cami {
            stroke-width: 10;
            stroke: #0000ff00;
            fill: transparent;
            transition: stroke 10s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .llum { stroke: #ff0000ff; }
    </style>

    <script>
        const visor = document.getElementById('visor');
        const svg = document.getElementById('elSVG');
        const tooltip = document.getElementById('tooltip');
        let isDown = false;             // Variables d'estat
        let startX, startY, scrollLeft, scrollTop;
        const ORG_WIDTH = 31645;            // Dimensions originals de la imatge (viewBox)
        const ORG_HEIGHT = 3278;
        const ASPECT_RATIO = ORG_WIDTH / ORG_HEIGHT;
        let currentScale = 1.0;         // Variables de zoom
        const ZOOM_SPEED = 0.1;         // Velocitat de zoom amb roda
        function initLayout() {         // 1. INICIALITZACIÓ: Ajusta a l'alçada de la pantalla (en píxels reals)
            const windowHeight = window.innerHeight;        // Calculem la mida inicial perquè encaixi verticalment
            const initialWidth = windowHeight * ASPECT_RATIO;
            svg.style.height = windowHeight + 'px';     // Apliquem dimensions físiques (això permet que el navegador faci zoom de manera nativa si vol)
            svg.style.width = initialWidth + 'px';
            visor.scrollLeft = (initialWidth - window.innerWidth) / 2;      // Centrem horitzontalment
        }
        window.onload = initLayout;
        window.addEventListener('resize', () => {       // Opcional: Recalcular si redimensionen la finestra (com rotar mòbil)
             if(Math.abs(svg.clientHeight - window.innerHeight) < 10) {     // Només reajustem si no hem fet zoom manual, per no perdre la posició
                 initLayout();
             }
        });
        visor.addEventListener('wheel', (e) => {        // 2. ZOOM AMB RODA DEL RATOLÍ (Càlcul vectorial per fer zoom cap al punter)
            if (e.ctrlKey) return;                  // Si premeu Ctrl, deixem que el navegador faci el vostre zoom nadiu
            e.preventDefault();
            const delta = Math.sign(e.deltaY) * -1;     //-1 a baix, 1 a dalt
            const scaleAmount = 1 + (delta * ZOOM_SPEED);
            const rect = svg.getBoundingClientRect();       // Obtenim dimensions actuals
            const currentW = rect.width;
            const currentH = rect.height;
            let newW = currentW * scaleAmount;              // Calculem noves dimensions
            let newH = currentH * scaleAmount;
            if (newH < window.innerHeight) {            // Límits (Mínim: alt de pantalla, Màxim: 5 vegades original)
                newH = window.innerHeight;
                newW = newH * ASPECT_RATIO;
            }
            if (newW > ORG_WIDTH * 5) return;       // Límit màxim
            const mouseX = e.clientX;           // Volem que el punt sota el ratolí es mantingui estable. 
            const mouseY = e.clientY;           // 1. Posició del ratolí relativa al visor
            const imageX = visor.scrollLeft + mouseX;       // 2. Posició del ratolí relativa a la imatge actual (offset)   
            const imageY = visor.scrollTop + mouseY;        // visor.scrollLeft + mouseX = posició absoluta a la imatge
            svg.style.width = newW + 'px';          // 3. Apliquem la nova mida
            svg.style.height = newH + 'px';
            const scaleFactor = newW / currentW;                // 4. Calculem el nou scroll per compensar el creixement
            visor.scrollLeft = (imageX * scaleFactor) - mouseX;     // La imatge ha crescut per un factor (newW / currentW).
            visor.scrollTop = (imageY * scaleFactor) - mouseY;      // El punt imageX ara està a imageX * factor.
        }, { passive: false });
        visor.addEventListener('mousedown', (e) => {            // 3. ARROSSEGAR (PANNING) - Actualitzat per a X i Y
            if(e.target.tagName === 'path') return;         // Si és un path, no arrosseguem
            isDown = true;
            visor.classList.add('arrastrando');
            startX = e.pageX - visor.offsetLeft;
            startY = e.pageY - visor.offsetTop;
            scrollLeft = visor.scrollLeft;
            scrollTop = visor.scrollTop;
        });
        visor.addEventListener('mouseleave', () => { isDown = false; visor.classList.remove('arrastrando'); });
        visor.addEventListener('mouseup', () => { isDown = false; visor.classList.remove('arrastrando'); });
        visor.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - visor.offsetLeft;
            const y = e.pageY - visor.offsetTop;
            const walkX = (x - startX) * 1;         // Velocitat 1:1
            const walkY = (y - startY) * 1;
            visor.scrollLeft = scrollLeft - walkX;
            visor.scrollTop = scrollTop - walkY;
        });
        function mostrarTooltip(e, esTactil) {              // 4. LÒGICA DE PATHS I TOOLTIP
            let clientX = esTactil ? e.touches[0].clientX : e.clientX;
            let clientY = esTactil ? e.touches[0].clientY : e.clientY;
            let target = document.elementFromPoint(clientX, clientY);
            if (target && target.tagName === 'path' && target.hasAttribute('ref')) {
                tooltip.textContent = target.getAttribute('ref');
                tooltip.style.display = 'block';
                tooltip.style.left = (clientX + 15) + 'px';
                tooltip.style.top = (clientY - 35) + 'px'; 
                svg.style.cursor = 'pointer';
            } else {
                svg.style.cursor = 'default';
            }
        }
        visor.addEventListener('mousedown', (e) => {
            if(e.target.tagName === 'path') {
                mostrarTooltip(e, false);
            }
        });
        document.addEventListener('mouseup', () => {
            tooltip.style.display = 'none';
            svg.style.cursor = 'default';
        });
    </script>
